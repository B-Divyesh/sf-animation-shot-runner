[package]
name = "animation-shot-runner"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Repeatable, manifest-driven animation preview renders with local receipts"
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-animation-shot-runner"
readme = "../../README.md"
keywords = ["animation", "render", "cli", "pipeline"]
categories = ["command-line-utilities", "multimedia"]

[[bin]]
name = "shot-runner"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

